# Written to violate labs/lab9/policies/extra/hardening.rego on purpose.
# It satisfies every rule in the shipped policy: non-root, no privilege
# escalation, read-only root filesystem, capabilities dropped, probes, limits,
# and no ":latest" tag. The only things wrong with it are the two this lab adds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-tagged
spec:
  replicas: 1
  selector:
    matchLabels: { app: juice-tagged }
  template:
    metadata:
      labels: { app: juice-tagged }
    spec:
      containers:
        - name: juice
          image: bkimminich/juice-shop:v20.0.0      # a tag, not a digest -> deny
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: juice-tagged
spec:
  type: NodePort                                     # -> warn
  selector: { app: juice-tagged }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30300
